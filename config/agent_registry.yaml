agents:
  - id: coordinator_agent
    type: control
    version: "0.1.0"
    enabled: true
    capabilities: [query_decomposition, task_planning, routing, arbitration, synthesis]
    write_actions: false

  # `enabled` gates whether this agent gets a graph node, an MCP allowlist entry,
  # and counts as "wired" for capability resolution/dispatch -- the one flag that
  # decides whether a domain is live in this build. `seleric_module` pins the
  # domain to a real Seleric MCP module (see modules_list); omit it when the
  # catalogue has no module for this domain yet (inventory/procurement/technical).
  - id: performance_agent
    type: domain
    version: "0.1.0"
    enabled: true
    domains: [meta_ads, google_ads]
    seleric_module: paidmedia
    capabilities: [campaign_analysis, cac_analysis, roas_analysis, attribution_analysis]
    mcp_capabilities: [performance.daily_cac]
    handoff_targets: [commerce_agent, funnel_agent, finance_agent]

  - id: commerce_agent
    type: domain
    version: "0.1.0"
    enabled: true
    domains: [shopify, amazon, blinkit]
    seleric_module: commerce
    capabilities: [orders, products, pricing, returns, ecommerce_analysis]
    mcp_capabilities: [commerce.daily_sales]
    allowed_metrics: [metric.net_sales, metric.gross_sales]
    handoff_targets: [funnel_agent, finance_agent, inventory_agent]

  - id: funnel_agent
    type: domain
    version: "0.1.0"
    enabled: true
    domains: [web_analytics, posthog]
    seleric_module: webanalytics
    capabilities: [funnel_analysis, journey_analysis, device_analysis]
    mcp_capabilities: []
    handoff_targets: [technical_agent, commerce_agent]

  - id: finance_agent
    type: domain
    version: "0.1.0"
    enabled: true
    domains: [finance]
    seleric_module: finance
    capabilities: [profitability, cogs, margin, cash]
    mcp_capabilities: []
    handoff_targets: [commerce_agent, inventory_agent, procurement_agent]

  - id: inventory_agent
    type: domain
    version: "0.1.0"
    enabled: false  # no Seleric MCP module for inventory yet
    domains: [inventory]
    capabilities: [stock_cover, stockout_risk, ageing]
    mcp_capabilities: []
    handoff_targets: [procurement_agent, commerce_agent]

  - id: procurement_agent
    type: domain
    version: "0.1.0"
    enabled: false  # no Seleric MCP module for procurement yet
    domains: [procurement]
    capabilities: [vendor, po, moq, lead_time]
    mcp_capabilities: []
    handoff_targets: [inventory_agent, finance_agent]

  - id: technical_agent
    type: domain
    version: "0.1.0"
    enabled: false  # no Seleric MCP module for technical/APM yet
    domains: [web_reliability]
    capabilities: [latency, errors, deployments, incident_analysis]
    mcp_capabilities: []
    handoff_targets: [funnel_agent]

  - id: observer_agent
    type: intelligence
    version: "0.1.0"
    enabled: true
    capabilities: [evidence_collection, metric_observation]

  - id: anomaly_agent
    type: intelligence
    version: "0.1.0"
    capabilities: [anomaly_analysis]

  - id: diagnostic_agent
    type: intelligence
    version: "1.0.0"
    capabilities:
      - hypothesis_generation
      - hypothesis_testing
      - causal_diagnosis
      - causal_refutation
      - root_cause_analysis
    inputs:
      - anomaly_artifact
      - evidence_bundle
      - causal_graph
    outputs:
      - diagnostic_artifact
      - causal_artifact
      - hypothesis
      - claim
    write_actions: false
    # Read-only. Emits DiagnosticArtifact + CausalAnalysisArtifact + causal Claim[]
    # - the contracts the Skeptic validates.
    module: seleric_swarm.agents.diagnostic
    policies: config/diagnostic_policies.yaml

  - id: prediction_agent
    type: intelligence
    version: "1.0.0"
    capabilities:
      - forecasting
      - forecast_orchestration
      - model_selection
      - scenario_projection
      - risk_prediction
    inputs:
      - evidence_bundle
      - anomaly_artifact
      - causal_artifact
      - model_registry
      - feature_store
    outputs:
      - forecast_artifact
      - claim
    write_actions: false
    # Forecast ORCHESTRATION, not a forecasting LLM. Numbers come only from a
    # registered production model or an approved statistical baseline; otherwise
    # INSUFFICIENT_PREDICTIVE_EVIDENCE. Emits ForecastArtifact + forecast Claim[].
    module: seleric_swarm.agents.prediction
    policies: config/prediction_policies.yaml

  - id: strategy_agent
    type: intelligence
    version: "0.1.0"
    capabilities: [intervention_design, scenario_analysis]

  - id: skeptic_agent
    type: intelligence
    version: "1.0.0"
    capabilities:
      - claim_validation
      - evidence_audit
      - contradiction_search
      - alternative_hypothesis_generation
      - causal_audit
      - forecast_audit
      - model_audit
      - strategy_audit
      - remediation_generation
      # legacy aliases kept so existing capability lookups still resolve
      - challenge
      - validation
    inputs:
      - claim
      - evidence_bundle
      - anomaly_artifact
      - diagnostic_artifact
      - causal_artifact
      - forecast_artifact
      - strategy_artifact
    outputs:
      - skeptic_verdict
      - challenge
      - evidence_gap
      - follow_up_task
    write_actions: false
    # Read-only. The Skeptic never becomes mission lead; it routes domain issues
    # back to the Coordinator via follow_up_task.preferred_domain.
    module: seleric_swarm.agents.skeptic
    policies: config/skeptic_policies.yaml
