# D-244 Marketing bot template (Phase 1: read-only). Tool names are the live D-238 names;
# at the D-239 cut-over only the skill files change (meta_* -> ads_meta_*).
template: marketing
name: Marketing
role: Paid media watch (Meta)
tools: []  # extra tools beyond what its skills bring (Settings > Advanced)
triggers:
  - kind: cron
    config: {cron: "0 9 * * *", timezone: Asia/Kolkata}
  - kind: signal
    config: {detector_prefix: "live.meta.", severities: [critical, warning]}
  # Starts a run when a campaign is paused/activated or its budget changes (checked every 15 min, no model call).
  # Off by default: every change costs a run.
  - kind: watch
    enabled: false
    config:
      tool: meta_campaigns_list
      args: {account_id: act_1685189008684458, status: [ACTIVE], limit: 500}
      fields: [effective_status, daily_budget, lifetime_budget]
      interval_min: 15
notify:
  email: []  # B19: names or addresses from the email contacts
# D-257: the goal is plain words; how to do the work is the Meta Ads skill (config/bots/skills/meta_ads.yaml).
skills: [meta_ads]
instructions: |
  Watch our Meta ads every day and tell me when money is being wasted or a campaign needs a change.
