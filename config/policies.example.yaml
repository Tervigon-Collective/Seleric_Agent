claims:
  numeric:
    require_evidence: true
  causal:
    require_hypothesis: true
    require_assumptions: true
    require_skeptic: true
  forecast:
    require_model_metadata: true
    allow_llm_numeric_fallback: false
  recommendation:
    require_mechanism_reference: true

missions:
  max_agent_turns: 30
  max_handoffs: 8
  max_runtime_seconds: 120
  write_actions: false
