features:
  - id: feature.cac.delta_1d
    version: 1
    entity: account
    grain: day
    formula: cac_t - cac_t_minus_1
    lookback: 1d
    leakage: safe

  - id: feature.atc_rate.rolling_7d_mean
    version: 1
    entity: store
    grain: day
    formula: mean(atc_rate over previous 7 completed days)
    lookback: 7d
    leakage: safe
