  - id: metric.collection_views
    version: 1
    owner: funnel
    catalogue_metric: collection_view_events
    description: Collection/category page view events.
    formula: count(collection_views)
    direction_bad: down
    unit: count
    grain: day
    timezone: Asia/Kolkata
    domain: funnel

  - id: metric.site_search_events
    version: 1
    owner: funnel
    catalogue_metric: site_search_events
    description: On-site search interaction events (volume only, no search terms).
    formula: count(site_search_events)
