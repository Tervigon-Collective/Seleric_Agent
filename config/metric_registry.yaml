metrics:
  - id: metric.net_sales
    version: 1
    owner: commerce
    description: Gross sales minus returns and discounts under the commerce definition.
    formula: gross_sales - returns - discounts_adjustment
    unit: INR
    grain: day
    timezone: Asia/Kolkata
    domain: commerce
    validation:
      - non_negative

  - id: metric.gross_sales
    version: 1
    owner: commerce
    description: Gross merchandise value before returns.
    formula: sum(order_gross)
    unit: INR
    grain: day
    timezone: Asia/Kolkata
    domain: commerce
    validation:
      - non_negative

  - id: metric.cac
    version: 1
    owner: performance
    description: Cost to acquire a purchase/order under the approved attribution definition.
    formula: spend / attributed_orders
    grain: day
    timezone: Asia/Kolkata
    domain: performance
    unit: INR
    validation:
      - denominator_non_negative
      - spend_non_negative

  - id: metric.atc_rate
    version: 1
    owner: funnel
    description: Add-to-cart sessions divided by eligible sessions.
    formula: atc_sessions / eligible_sessions
    unit: ratio
    grain: day
    timezone: Asia/Kolkata
    domain: funnel

  - id: metric.net_profit
    version: 1
    owner: finance
    description: Canonical net profit per the finance P&L definition.
    formula: gross_profit - operating_cost
    unit: INR
    grain: day
    timezone: Asia/Kolkata
    domain: finance

  - id: metric.atc_to_purchase_rate
    version: 1
    owner: funnel
    description: Purchases divided by add-to-cart events/sessions according to funnel definition.
    formula: purchases / add_to_cart
    grain: day
    timezone: Asia/Kolkata
    domain: funnel

  - id: metric.units_sold
    version: 1
    owner: product
    description: Net units (ordered minus refunded) on eligible placement lines.
    formula: ordered_units - refunded_units
    unit: units
    grain: day
    timezone: Asia/Kolkata
    domain: product

  - id: metric.repeat_rate
    version: 1
    owner: customer
    description: Repeat customers divided by customers in the query window.
    formula: repeat_customers / customers
    unit: ratio
    grain: day
    timezone: Asia/Kolkata
    domain: customer

  - id: metric.refunded_amount_excl_tax
    version: 1
    owner: operations
    description: Refund amount excluding tax on the refund event date.
    formula: sum(refund_amount_ex_gst)
    unit: INR
    grain: day
    timezone: Asia/Kolkata
    domain: operations

  - id: metric.attributed_net_revenue
    version: 1
    owner: attribution
    description: First-party, last-touch attributed net revenue across channels.
    formula: sum(attributed_net_revenue)
    unit: INR
    grain: day
    timezone: Asia/Kolkata
    domain: attribution
    validation:
      - non_negative
