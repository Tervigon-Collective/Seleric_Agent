  - id: metric.product_view_events
    version: 1
    owner: funnel
    catalogue_metric: product_view_events
    description: Product detail page view events (event count, not sessions).
    formula: count(product_views)
    direction_bad: down
    unit: count
    grain: day
    timezone: Asia/Kolkata
