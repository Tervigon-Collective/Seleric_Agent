# India calendar covariates for forecasting (known-future only).
# Features generated: dow, dom, month_end, payday, festival, pre_festival.
version: 1
timezone: Asia/Kolkata
# Payday window: last 2 days and first 2 days of each month (salary cycle).
payday:
  month_start_days: [1, 2]
  month_end_days: [0, -1]  # 0 = last day, -1 = second-to-last
month_end_days: [0]  # last calendar day flagged as month_end
festivals:
  # National holidays and major festivals 2023–2027 (fixed + approximate lunar dates).
  - {id: republic_day, dates: ["2023-01-26", "2024-01-26", "2025-01-26", "2026-01-26", "2027-01-26"]}
  - {id: holi, dates: ["2023-03-08", "2024-03-25", "2025-03-14", "2026-03-03", "2027-03-22"]}
  - {id: good_friday, dates: ["2023-04-07", "2024-03-29", "2025-04-18", "2026-04-03", "2027-03-26"]}
  - {id: eid_ul_fitr, dates: ["2023-04-22", "2024-04-11", "2025-03-31", "2026-03-20", "2027-03-10"]}
  - {id: eid_ul_adha, dates: ["2023-06-29", "2024-06-17", "2025-06-07", "2026-05-27", "2027-05-17"]}
  - {id: independence_day, dates: ["2023-08-15", "2024-08-15", "2025-08-15", "2026-08-15", "2027-08-15"]}
  - {id: raksha_bandhan, dates: ["2023-08-30", "2024-08-19", "2025-08-09", "2026-08-28", "2027-08-17"]}
  - {id: ganesh_chaturthi, dates: ["2023-09-19", "2024-09-07", "2025-08-27", "2026-09-14", "2027-09-04"]}
  - {id: gandhi_jayanti, dates: ["2023-10-02", "2024-10-02", "2025-10-02", "2026-10-02", "2027-10-02"]}
  - {id: dussehra, dates: ["2023-10-24", "2024-10-12", "2025-10-02", "2026-10-20", "2027-10-09"]}
  - {id: diwali, dates: ["2023-11-12", "2024-11-01", "2025-10-20", "2026-11-08", "2027-10-29"]}
  - {id: christmas, dates: ["2023-12-25", "2024-12-25", "2025-12-25", "2026-12-25", "2027-12-25"]}
# Days before each festival date also flagged as pre_festival.
pre_festival_days: 3
