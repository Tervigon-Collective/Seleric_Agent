# Diagnostic Agent policy + threshold configuration.
# Loaded by seleric_swarm.agents.diagnostic.policies.DiagnosticPolicies.load().

diagnostic:
  budgets:
    # how many causal-graph ancestor nodes get a DoWhy run per diagnosis.
    # Raised from the old max_primary_candidates(=2) since the goal is finding
    # every responsible node, not validating a single LLM guess -- still
    # bounded for DoWhy runtime/cost.
    max_causal_candidates: 6
    max_llm_calls: 3
    max_runtime_seconds: 90

  causal:
    require_graph: true
    require_temporal_check: true
    min_refutations: 2
    estimator: backdoor.linear_regression
    refuters:
      - placebo_treatment_refuter
      - random_common_cause
      - data_subset_refuter
    # confidence -> retain decision
    retain_at_or_above: CAUSALLY_SUPPORTED_UNDER_ASSUMPTIONS
    # a passing metadata-only causal check (no observations) caps confidence here
    metadata_only_ceiling: PLAUSIBLE_CAUSAL

  scenarios:
    # LLM narrates DoWhy-confirmed candidates only; never proposes a mechanism
    # or a confidence tier. Deterministic fallback sentence used if false.
    llm_enrichment: true
    max_scenarios: 6

  synthesis:
    # if no candidate reaches retain, emit the best as "inconclusive" not "retained"
    emit_inconclusive_finding: true
    always_note_confounding: true
