# Diagnostic Agent policy + threshold configuration.
# Loaded by seleric_swarm.agents.diagnostic.policies.DiagnosticPolicies.load().

diagnostic:
  budgets:
    max_hypotheses: 6
    max_primary_candidates: 2      # how many top hypotheses get a causal estimate
    max_tests_per_hypothesis: 6
    max_llm_calls: 3
    max_runtime_seconds: 90

  hypotheses:
    # a hypothesis needs at least this much direct evidence overlap to be testable
    min_supporting_evidence: 1
    # deterministic template hypotheses always included; LLM only enriches
    llm_enrichment: true
    prior_weights:
      evidence_overlap: 0.4
      incident_match: 0.3
      temporal_alignment: 0.2
      mechanism_specificity: 0.1

  testing:
    # hard gates: a failed hard-gate test rejects the hypothesis regardless of score
    hard_gates:
      - temporal_precedence
    temporal_tolerance_minutes: 90      # treatment may lag the event by up to this
    min_segment_divergence_pct: 10      # affected vs control segment gap for "specific"
    dose_response_min_pairs: 2

  causal:
    require_graph: true
    require_temporal_check: true
    min_refutations: 2
    estimator: backdoor.linear_regression
    refuters:
      - placebo_treatment_refuter
      - random_common_cause
      - data_subset_refuter
    # confidence -> retain decision
    retain_at_or_above: CAUSALLY_SUPPORTED_UNDER_ASSUMPTIONS
    # a passing metadata-only causal check (no observations) caps confidence here
    metadata_only_ceiling: PLAUSIBLE_CAUSAL

  synthesis:
    # if no hypothesis reaches retain, emit the best as "inconclusive" not "retained"
    emit_inconclusive_finding: true
    always_note_confounding: true
