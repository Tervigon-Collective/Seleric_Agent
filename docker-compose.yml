services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seleric
      POSTGRES_PASSWORD: seleric
      POSTGRES_DB: seleric_swarm
    # Host 5432 is commonly taken (e.g. OpenMetadata). Publish 5433 by default;
    # override with POSTGRES_PUBLISH_PORT. In-compose services still use
    # postgres:5432 on the Docker network (see DATABASE_URL defaults below).
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - seleric_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seleric -d seleric_swarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - seleric_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: .
    command: ["/bin/sh", "-c", "seleric-migrate && exec seleric-api"]
    ports:
      - "${API_PUBLISH_PORT:-8090}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LLM_PROVIDER: ${LLM_PROVIDER:-azure_openai_compatible}
      PERSISTENCE_BACKEND: ${PERSISTENCE_BACKEND:-postgres}
      # In-network URL only. Do not reuse host DATABASE_URL from .env (that
      # points at 127.0.0.1:POSTGRES_PUBLISH_PORT for local tools/API).
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://seleric:seleric@postgres:5432/seleric_swarm}
      CHECKPOINT_BACKEND: ${CHECKPOINT_BACKEND:-postgres}
      CANCELLATION_BACKEND: ${CANCELLATION_BACKEND:-redis}
      EVENT_NOTIFIER_BACKEND: ${EVENT_NOTIFIER_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RUN_LEASE_S: ${RUN_LEASE_S:-60}
      RUN_HEARTBEAT_S: ${RUN_HEARTBEAT_S:-15}
      RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}
      RUN_RETRY_DELAY_S: ${RUN_RETRY_DELAY_S:-5}
      BLOB_BACKEND: ${BLOB_BACKEND:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-seleric-attachments}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MALWARE_SCANNER_BACKEND: ${MALWARE_SCANNER_BACKEND:-clamav}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      ALLOW_WRITE_ACTIONS: "false"
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_MODELS: ${AZURE_OPENAI_MODELS:-}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:-}
      SELERIC_MCP_URL: ${SELERIC_MCP_URL:-}
      SELERIC_MCP_TOKEN: ${SELERIC_MCP_TOKEN:-}
      API_KEY: ${API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  recovery:
    build: .
    command:
      - seleric-recover
      - --executor
      - seleric_swarm.api.conversations:build_submission_executor
      - --interval
      - "${RUN_RECOVERY_INTERVAL_S:-5}"
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_PROVIDER: ${LLM_PROVIDER:-azure_openai_compatible}
      PERSISTENCE_BACKEND: ${PERSISTENCE_BACKEND:-postgres}
      # In-network URL only. Do not reuse host DATABASE_URL from .env (that
      # points at 127.0.0.1:POSTGRES_PUBLISH_PORT for local tools/API).
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://seleric:seleric@postgres:5432/seleric_swarm}
      CHECKPOINT_BACKEND: ${CHECKPOINT_BACKEND:-postgres}
      CANCELLATION_BACKEND: ${CANCELLATION_BACKEND:-redis}
      EVENT_NOTIFIER_BACKEND: ${EVENT_NOTIFIER_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RUN_WORKER_ID: ${RUN_WORKER_ID:-recovery-worker}
      RUN_LEASE_S: ${RUN_LEASE_S:-60}
      RUN_HEARTBEAT_S: ${RUN_HEARTBEAT_S:-15}
      RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}
      RUN_RETRY_DELAY_S: ${RUN_RETRY_DELAY_S:-5}
      BLOB_BACKEND: ${BLOB_BACKEND:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-seleric-attachments}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MALWARE_SCANNER_BACKEND: ${MALWARE_SCANNER_BACKEND:-clamav}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      ALLOW_WRITE_ACTIONS: "false"
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_MODELS: ${AZURE_OPENAI_MODELS:-}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:-}
      SELERIC_MCP_URL: ${SELERIC_MCP_URL:-}
      SELERIC_MCP_TOKEN: ${SELERIC_MCP_TOKEN:-}
      API_KEY: ${API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  seleric_postgres:
  seleric_minio:
