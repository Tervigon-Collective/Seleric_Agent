services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seleric
      POSTGRES_PASSWORD: seleric
      POSTGRES_DB: seleric_swarm
    ports:
      - "5432:5432"
    volumes:
      - seleric_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  seleric_postgres:
