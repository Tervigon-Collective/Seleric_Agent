name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
      APP_ENV: test
      LANGSMITH_TRACING: "false"
      PERSISTENCE_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync --extra dev
      - name: Unit, contract, replay, adversarial
        run: uv run pytest -q
      - name: Validate repo contracts
        run: uv run python scripts/validate_repo.py
      - name: Deterministic eval
        run: uv run python -m seleric_swarm.eval lookup_v1
