<title>Seleric Ops Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left domain rail + one working area. Unified view = domain health row, then a ranked signal feed (severity x money at stake).
   Domain views are rendered from the same monitor/metric config, so every tab has the same anatomy. */
:root {
  --bg: #eceff4;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --line: #dce1e8;
  --ink: #131820;
  --ink-2: #485160;
  --ink-3: #6d7685;
  --accent: #2a6fd0;
  --accent-soft: #e3edfb;
  --crit: #c0301d;
  --crit-soft: #fbe8e4;
  --warn: #965a00;
  --warn-soft: #faefd8;
  --ok: #11764d;
  --ok-soft: #dff2e8;
  --s1: #2a78d6;
  --s2: #eb6834;
  --band: rgba(42, 120, 214, .13);
  --font: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --surface-2: #1c212a; --line: #2a303b;
    --ink: #eceef2; --ink-2: #b5bcc8; --ink-3: #8790a0;
    --accent: #6aa5f2; --accent-soft: #1a2a43;
    --crit: #f2735f; --crit-soft: #3a1e1a; --warn: #e3a43f; --warn-soft: #382b13; --ok: #4fc58b; --ok-soft: #13301f;
    --s1: #3987e5; --s2: #d95926; --band: rgba(57, 135, 229, .16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --surface-2: #1c212a; --line: #2a303b;
  --ink: #eceef2; --ink-2: #b5bcc8; --ink-3: #8790a0;
  --accent: #6aa5f2; --accent-soft: #1a2a43;
  --crit: #f2735f; --crit-soft: #3a1e1a; --warn: #e3a43f; --warn-soft: #382b13; --ok: #4fc58b; --ok-soft: #13301f;
  --s1: #3987e5; --s2: #d95926; --band: rgba(57, 135, 229, .16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; align-self: start; height: 100vh; }
.logo { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 700; font-size: 15px; }
.logo i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
.logo i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .grp { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 10px 8px 4px; }
.nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: none; border: 0; text-align: left; padding: 8px; border-radius: 6px; color: var(--ink-2); font-weight: 500; }
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.badge { font-family: var(--mono); font-size: 11px; min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); }
.badge.crit { background: var(--crit-soft); color: var(--crit); }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--ink-3); padding: 0 8px; display: flex; flex-direction: column; gap: 6px; }

.main { min-width: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 40px max(24px, env(safe-area-inset-left, 0px)); }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 14px; }
.top h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.top .sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.ctrls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 12px; color: var(--ink-2); font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.fresh { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.dot.warn { background: var(--warn); }
.mock { font-size: 12px; color: var(--ink-3); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel > h2 { font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 12px; }
.panel > h2 small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.grid { display: grid; gap: 14px; }
.cols-4 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.cols-3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.split { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
.lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

.dcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.dcard:hover { border-color: var(--accent); }
.dcard .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dcard .name { font-weight: 600; }
.dcard .big { font-family: var(--mono); font-size: 24px; font-weight: 500; letter-spacing: -.02em; }
.dcard .meta { font-size: 12px; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.info { background: var(--surface-2); color: var(--ink-2); }
.d-neg { color: var(--crit); } .d-pos { color: var(--ok); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 3px 11px; font-size: 12.5px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.feedhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 12px; }
.feedhead h2 { font-size: 15px; }
.feedhead small { color: var(--ink-3); font-weight: 400; margin-left: 6px; }

.sig { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 128px 108px auto; gap: 14px; align-items: center; padding: 14px 14px 14px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.sig + .sig { margin-top: 8px; }
.sig::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 3px 3px 0; background: var(--ink-3); }
.sig.crit::before { background: var(--crit); } .sig.warn::before { background: var(--warn); } .sig.info::before { background: var(--ink-3); }
.sig.acked { opacity: .6; }
.sig h3 { font-size: 14.5px; font-weight: 600; margin: 6px 0 2px; }
.sig .ent { color: var(--ink-2); font-size: 12.5px; }
.sig .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); font-weight: 500; }
.sig .v b { display: block; font-family: var(--mono); font-weight: 500; font-size: 16px; }
.sig .v i { font-style: normal; color: var(--ink-3); font-size: 12px; font-family: var(--mono); }
.act { display: flex; gap: 6px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--ink-3); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.why { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.why .drv { display: grid; grid-template-columns: minmax(0, 1fr) 150px 40px; gap: 10px; align-items: center; font-size: 13px; }
.why .bar, .hb { height: 8px; border-radius: 4px; background: var(--surface-2); position: relative; }
.why .bar i, .hb i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--s1); }
.why .src { font-size: 12px; color: var(--ink-3); }

.stake { display: grid; gap: 10px; }
.stake .r { display: grid; grid-template-columns: 78px minmax(0, 1fr) 62px; gap: 8px; align-items: center; font-size: 13px; }
.stake .r span:last-child { text-align: right; font-family: var(--mono); font-size: 12.5px; }
.note { font-size: 12.5px; color: var(--ink-2); }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.kv:first-of-type { border-top: 0; }

.kpi .v { font-family: var(--mono); font-size: 26px; font-weight: 500; letter-spacing: -.02em; }
.kpi .d { font-size: 12.5px; margin-top: 2px; }
.kpi .e { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

.chartwrap { position: relative; }
.chartwrap svg { display: block; width: 100%; overflow: visible; }
.chartwrap text { font-family: var(--mono); font-size: 11px; fill: var(--ink-3); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 7px; padding: 7px 10px; font-size: 12px; white-space: nowrap; z-index: 3; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
.tip b { font-family: var(--mono); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 0 10px 8px 0; white-space: nowrap; }
td { padding: 9px 10px 9px 0; border-top: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
tbody tr[data-m] { cursor: pointer; } tbody tr[data-m]:hover td { background: var(--surface-2); }
tbody tr.sel td { background: var(--accent-soft); }

.sec { display: grid; grid-template-columns: 150px minmax(0, 1fr) 118px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.sec:first-of-type { border-top: 0; }
.hb { height: 16px; border-radius: 3px; }
.hb i { border-radius: 3px; background: var(--s1); }
.hb.leak i { background: var(--crit); }
.hb em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.sec .ret { text-align: right; font-family: var(--mono); font-size: 12.5px; }

.cover { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; min-width: 130px; }
.cover i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.cover em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }

pre.yaml { margin: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--ink); }
.tgl { width: 34px; height: 20px; border-radius: 10px; background: var(--line); border: 0; position: relative; padding: 0; }
.tgl::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.tgl[aria-checked="true"] { background: var(--accent); } .tgl[aria-checked="true"]::after { left: 16px; }
.dtag { font-family: var(--mono); font-size: 11.5px; }
.themebtn { background: none; border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; color: var(--ink-2); font-size: 12px; }

@media (max-width: 980px) { .split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px max(16px, env(safe-area-inset-left, 0px)); gap: 12px; overflow-x: auto; }
  .nav { flex-direction: row; } .nav .grp, .rail-foot, .logo span { display: none; }
  .nav button { white-space: nowrap; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .sig { grid-template-columns: minmax(0, 1fr) 1fr; }
  .sig .sig-main { grid-column: 1 / -1; }
  .act { grid-column: 1 / -1; }
  .sec { grid-template-columns: minmax(0, 1fr) 100px; }
  .sec .hb { grid-column: 1 / -1; grid-row: 2; }
  .why .drv { grid-template-columns: minmax(0, 1fr) 40px; } .why .bar { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { .tgl::after { transition: none; } }
</style>

<div class="app">
  <aside class="rail">
    <div class="logo"><i></i><span>Seleric Ops</span></div>
    <nav class="nav" id="nav" aria-label="Domains"></nav>
    <div class="rail-foot">
      <span>Brand: <b>Brand 20</b></span>
      <span>41 monitors · 6 domains</span>
      <button class="themebtn" id="themebtn" type="button">Toggle theme</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div>
      <div class="ctrls">
        <div class="seg" role="group" aria-label="Window" id="win">
          <button type="button" aria-pressed="false">Today</button>
          <button type="button" aria-pressed="false">7d</button>
          <button type="button" aria-pressed="true">28d</button>
        </div>
        <span class="fresh"><span class="dot warn"></span>Evaluated 6 min ago · 1 source lagging</span>
      </div>
    </header>
    <p class="mock">Design mockup with sample data. Names, numbers and rupee values are invented to show the layout; nothing here is read from the warehouse.</p>
    <div id="view"></div>
  </main>
</div>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const inr = n => '₹' + (n >= 1e5 ? (n / 1e5).toFixed(n >= 1e6 ? 1 : 2).replace(/\.?0+$/, '') + 'L' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : n);

  const DOMAINS = [
    { id: 'unified', label: 'Unified', sub: 'Everything that needs a person, ranked by money at stake' },
    { id: 'marketing', label: 'Marketing', sub: 'Ads, creatives and channel efficiency', owner: 'Marketing' },
    { id: 'website', label: 'Website', sub: 'Product page sections, funnel and speed', owner: 'Website' },
    { id: 'inventory', label: 'Inventory', sub: 'Stock cover against sales velocity and supplier lead time', owner: 'Inventory' },
    { id: 'finance', label: 'Finance', sub: 'Margin, MER, returns and cost lines', owner: 'Finance' },
    { id: 'monitors', label: 'Monitors', sub: 'Every rule behind these signals. Adding a case is a config row.' }
  ];

  const SIGNALS = [
    { id: 1, dom: 'Marketing', sev: 'crit', title: 'Hook rate has fallen for 7 days', ent: 'Ad · Kurta-UGC-03 · Prospecting India', det: 'Trend', obs: '22%', exp: '31%', stake: 48000, per: '/day', owner: 'Marketing', since: '6d', why: [['Creative fatigue: frequency 3.8 to 5.1', 52], ['Audience shift: age 18–24 share 22% to 41%', 31], ['Placement mix: Reels 40% to 63%', 17]] },
    { id: 2, dom: 'Inventory', sev: 'crit', title: 'Stock cover is below supplier lead time', ent: 'SKU · Linen Shirt Olive / M · 130 on hand', det: 'Threshold', obs: '4.2 d', exp: '≥ 12 d', stake: 310000, per: ' est.', owner: 'Inventory', since: '2d', why: [['Velocity up: 18 to 31 units/day (7d)', 64], ['Restock PO-2291 delayed 5 days', 28], ['Return restocks slower than usual', 8]] },
    { id: 3, dom: 'Website', sev: 'warn', title: 'Visitors leak before the Reviews section', ent: 'Product · Cotton Kurta Set · mobile', det: 'Stage leak', obs: '60%', exp: '85%', stake: 120000, per: '/day', owner: 'Website', since: '3d', why: [['Reviews block now loads below a lazy image row', 57], ['Mobile only: desktop retention unchanged', 30], ['Average rating dropped 4.6 to 4.4', 13]] },
    { id: 4, dom: 'Marketing', sev: 'warn', title: 'CTR is under its weekday baseline', ent: 'Campaign · Summer Kurta · Prospecting', det: 'Baseline', obs: '1.38%', exp: '1.90%', stake: 36000, per: '/day', owner: 'Marketing', since: '5d', why: [['Two new creatives with low thumb-stop', 49], ['Meta auction CPM +14%', 33], ['Audience overlap with retargeting', 18]] },
    { id: 5, dom: 'Website', sev: 'warn', title: 'Offers and EMI section is being skipped', ent: 'Product · Cotton Kurta Set · all devices', det: 'Stage leak', obs: '61%', exp: '74%', stake: 54000, per: '/day', owner: 'Website', since: '4d', why: [['Section moved below size selector', 71], ['Offer copy changed on Oct 25', 29]] },
    { id: 6, dom: 'Finance', sev: 'warn', title: 'MER is below its expected range', ent: 'Store total · event-date basis', det: 'Baseline', obs: '2.1x', exp: '2.9x', stake: 92000, per: '/day', owner: 'Finance', since: '2d', why: [['Spend up 12% with flat net sales', 58], ['Return share of orders 9% to 13%', 42]] },
    { id: 7, dom: 'Data', sev: 'warn', title: 'Google Ads ingest returned 0 rows', ent: 'Source · google_ads · last good run 05:55', det: 'Freshness', obs: '0 rows', exp: '~1.2k', stake: 0, per: '', owner: 'Data', since: '3h', why: [['Run reports COMPLETED with an empty window', 100]] },
    { id: 8, dom: 'Finance', sev: 'info', title: 'RTO cost trending up', ent: 'Cost line · rto_cost · rolling 7d', det: 'Trend', obs: '+18%', exp: '±6%', stake: 21000, per: '/day', owner: 'Finance', since: '5d', why: [['Cash-on-delivery share 41% to 49%', 66], ['Two pincodes with 3x return rate', 34]] },
    { id: 9, dom: 'Inventory', sev: 'info', title: 'Overstock: cover far above target', ent: 'SKU · Denim Jacket Indigo / L · 420 on hand', det: 'Threshold', obs: '140 d', exp: '≤ 60 d', stake: 64000, per: ' tied up', owner: 'Inventory', since: '9d', why: [['Velocity 3 units/day, flat for 28 days', 100]] }
  ];
  SIGNALS.forEach(s => { s.acked = false; });
  const SEV = { crit: ['Critical', 'crit'], warn: ['Watch', 'warn'], info: ['Info', 'info'] };

  const HEALTH = [
    { id: 'marketing', dom: 'Marketing', status: 'crit', key: 'Blended CTR', val: '1.52%', delta: '-0.38 pt vs expected', spark: [1.9, 1.95, 1.88, 1.92, 1.85, 1.8, 1.7, 1.6, 1.52] },
    { id: 'website', dom: 'Website', status: 'warn', key: 'PDP to add-to-cart', val: '6.1%', delta: '-0.9 pt vs expected', spark: [7.0, 7.1, 6.9, 7.0, 6.8, 6.6, 6.4, 6.2, 6.1] },
    { id: 'inventory', dom: 'Inventory', status: 'crit', key: 'SKUs under lead-time cover', val: '7 / 212', delta: '+3 since last week', spark: [3, 3, 4, 4, 4, 5, 6, 6, 7] },
    { id: 'finance', dom: 'Finance', status: 'warn', key: 'MER', val: '2.1x', delta: '-0.8x vs expected', spark: [2.9, 2.95, 2.85, 2.8, 2.6, 2.5, 2.3, 2.2, 2.1] }
  ];

  /* ---------- helpers ---------- */
  function spark(v, color) {
    const w = 96, h = 30, mn = Math.min(...v), mx = Math.max(...v), r = mx - mn || 1;
    const pts = v.map((y, i) => [2 + i * (w - 4) / (v.length - 1), h - 3 - (y - mn) / r * (h - 8)]);
    const line = pts.map(p => p.join(',')).join(' ');
    const e = pts[pts.length - 1];
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polygon points="2,${h} ${line} ${w - 2},${h}" fill="${color}" opacity=".12"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${e[0]}" cy="${e[1]}" r="3" fill="${color}"/></svg>`;
  }
  const sevColor = s => s === 'crit' ? 'var(--crit)' : s === 'warn' ? 'var(--warn)' : 'var(--s1)';
  const pill = s => `<span class="pill ${SEV[s][1]}">${SEV[s][0]}</span>`;

  function lineChart(host, o) {
    const w = host.clientWidth || 640, h = 240, p = { l: 40, r: 10, t: 12, b: 26 };
    const n = o.actual.length, hi = o.exp.map(e => e + o.half), lo = o.exp.map(e => e - o.half);
    const mn = Math.floor(Math.min(...o.actual, ...lo) * 10) / 10 - .1, mx = Math.ceil(Math.max(...o.actual, ...hi) * 10) / 10 + .1;
    const X = i => p.l + i * (w - p.l - p.r) / (n - 1), Y = v => p.t + (1 - (v - mn) / (mx - mn)) * (h - p.t - p.b);
    let g = '';
    for (let k = 0; k <= 4; k++) { const v = mn + (mx - mn) * k / 4; g += `<line x1="${p.l}" x2="${w - p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${p.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(1)}</text>`; }
    const xl = [0, 7, 14, 21, 27].map(i => `<text x="${X(i)}" y="${h - 6}" text-anchor="middle">Oct ${2 + i}</text>`).join('');
    const band = `<polygon points="${hi.map((v, i) => X(i) + ',' + Y(v)).join(' ')} ${lo.map((v, i) => X(n - 1 - i) + ',' + Y(lo[n - 1 - i])).join(' ')}" fill="var(--band)"/>`;
    const expL = `<polyline points="${o.exp.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    const act = `<polyline points="${o.actual.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const flags = o.actual.map((v, i) => i >= o.flagFrom ? `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="var(--crit)" stroke="var(--surface)" stroke-width="2"/>` : '').join('');
    host.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.label}">${g}${xl}${band}${expL}${act}${flags}<line id="cx" y1="${p.t}" y2="${h - p.b}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/><rect x="${p.l}" y="0" width="${w - p.l - p.r}" height="${h - p.b}" fill="transparent" id="hit"/></svg><div class="tip" hidden></div>`;
    const tip = $('.tip', host), cx = $('#cx', host);
    $('#hit', host).addEventListener('pointermove', e => {
      const r = host.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.round((e.clientX - r.left - p.l) / (w - p.l - p.r) * (n - 1))));
      cx.setAttribute('x1', X(i)); cx.setAttribute('x2', X(i)); cx.setAttribute('visibility', 'visible');
      tip.hidden = false; tip.innerHTML = `Oct ${2 + i}<br>Actual <b>${o.actual[i].toFixed(2)}${o.unit}</b><br>Expected <b>${o.exp[i].toFixed(2)}${o.unit}</b> ± ${o.half.toFixed(2)}`;
      tip.style.left = Math.min(X(i) + 12, w - 160) + 'px'; tip.style.top = '8px';
    });
    $('#hit', host).addEventListener('pointerleave', () => { tip.hidden = true; cx.setAttribute('visibility', 'hidden'); });
  }
  const ctr = (() => {
    const exp = [], actual = [];
    for (let i = 0; i < 28; i++) {
      const e = 1.9 + .08 * Math.sin(i / 4) + (i % 7 >= 5 ? .06 : 0); exp.push(e);
      actual.push(e + .07 * Math.sin(i * 2.3) + (i >= 23 ? -.1 * (i - 22) : 0));
    }
    return { exp, actual };
  })();

  /* ---------- views ---------- */
  function signalCard(s) {
    const why = s.why.map(w => `<div class="drv"><span>${w[0]}</span><span class="bar"><i style="width:${w[1]}%"></i></span><span class="num">${w[1]}%</span></div>`).join('');
    return `<article class="sig ${s.sev}${s.acked ? ' acked' : ''}" data-id="${s.id}">
      <div class="sig-main"><div class="tags">${pill(s.sev)}<span class="tag">${s.dom}</span><span class="tag">${s.det}</span><span>open ${s.since}</span></div>
        <h3>${s.title}</h3><p class="ent">${s.ent}</p></div>
      <div class="v"><span class="lbl">Observed</span><b>${s.obs}</b><i>expected ${s.exp}</i></div>
      <div class="v"><span class="lbl">At stake</span><b>${s.stake ? inr(s.stake) : '–'}</b><i>${s.stake ? s.per.trim() : 'data quality'}</i></div>
      <div class="act"><button class="btn" data-act="ack" type="button">${s.acked ? 'Acknowledged' : 'Acknowledge'}</button><button class="btn pri" data-act="why" type="button" aria-expanded="false">Ask why</button></div>
      <div class="why" hidden>${why}<p class="src">Diagnosis engine · ${s.why.length * 4 + 2} candidate drivers tested · shares are contribution to the gap</p></div></article>`;
  }

  function feedHTML(dom) {
    const list = SIGNALS.filter(s => !dom || s.dom === dom).sort((a, b) => ({ crit: 0, warn: 1, info: 2 })[a.sev] - ({ crit: 0, warn: 1, info: 2 })[b.sev] || b.stake - a.stake);
    return list.map(signalCard).join('') || '<p class="note">No open signals.</p>';
  }

  function unified() {
    const cards = HEALTH.map(h => `<button class="dcard" data-go="${h.id}" type="button">
      <div class="row"><span class="name">${h.dom}</span>${pill(h.status)}</div>
      <div class="meta">${h.key}</div><div class="row"><span class="big">${h.val}</span>${spark(h.spark, sevColor(h.status))}</div>
      <div class="meta d-neg">${h.delta}</div></button>`).join('');
    const doms = ['Inventory', 'Finance', 'Marketing', 'Website'].map(d => [d, SIGNALS.filter(s => s.dom === d).reduce((a, s) => a + s.stake, 0)]).sort((a, b) => b[1] - a[1]);
    const top = doms[0][1];
    const stake = doms.map(d => `<div class="r"><span>${d[0]}</span><span class="hb"><i style="width:${d[1] / top * 100}%"></i></span><span>${inr(d[1])}</span></div>`).join('');
    return `<div class="grid cols-4" style="margin-bottom:16px">${cards}</div>
    <div class="grid split">
      <section><div class="feedhead"><h2>Open signals<small id="cnt"></small></h2>
        <div class="chips" id="chips">${['All', 'Marketing', 'Website', 'Inventory', 'Finance', 'Data'].map((c, i) => `<button class="chip" type="button" aria-pressed="${i === 0}">${c}</button>`).join('')}</div></div>
        <div id="feed">${feedHTML()}</div></section>
      <aside class="grid">
        <div class="panel"><h2>Money at stake <small>per day, by domain</small></h2><div class="stake">${stake}</div>
          <p class="note" style="margin-top:12px">Stake = affected spend or sales x size of the gap. It orders the feed so the top card is the one worth a person's next hour.</p></div>
        <div class="panel"><h2>Monitor coverage</h2>
          <div class="kv"><span>Monitors running</span><b class="num">41</b></div>
          <div class="kv"><span>Raised a signal</span><b class="num">9</b></div>
          <div class="kv"><span>Muted (low volume)</span><b class="num">6</b></div>
          <div class="kv"><span>Last full evaluation</span><b class="num">06 min ago</b></div></div>
      </aside></div>`;
  }

  function marketing() {
    const ads = [
      ['Kurta-UGC-03', 'Prospecting India', 48000, 22, 31, [31, 31, 30, 29, 27, 25, 22], 'crit'],
      ['Kurta-Static-11', 'Prospecting India', 36000, 27, 29, [29, 28, 29, 28, 27, 28, 27], 'ok'],
      ['Shirt-Reel-07', 'Retargeting 30d', 22000, 38, 36, [35, 36, 37, 36, 38, 38, 38], 'ok'],
      ['Dress-UGC-09', 'Prospecting India', 31000, 26, 30, [30, 29, 29, 28, 27, 27, 26], 'warn'],
      ['Set-Carousel-02', 'Lookalike 2%', 17000, 24, 24, [24, 25, 24, 23, 24, 24, 24], 'ok']
    ].map(a => `<tr><td><b>${a[0]}</b><div class="note">${a[1]}</div></td><td class="r num">${inr(a[2])}/d</td><td class="r num"><b>${a[3]}%</b></td><td class="r num" style="color:var(--ink-3)">${a[4]}%</td><td>${spark(a[5], sevColor(a[6] === 'ok' ? 'info' : a[6]))}</td><td>${a[6] === 'ok' ? '<span class="pill ok">Normal</span>' : pill(a[6])}</td></tr>`).join('');
    return `<div class="grid cols-3" style="margin-bottom:14px">
      ${kpi('Blended CTR', '1.52%', '-0.38 pt vs expected', 1, 'Expected 1.90% ± 0.22')}

    <div class="grid split">
      <div class="panel"><h2>CTR · Summer Kurta, Prospecting <small>daily, 28 days</small></h2><div class="chartwrap" id="ctr"></div>
        <div class="legend"><span><i style="background:var(--s1)"></i>Actual</span><span><i style="background:var(--ink-3)"></i>Expected (same weekday)</span><span><i style="background:var(--band);height:10px"></i>Normal range</span><span><i style="background:var(--crit);height:8px;width:8px;border-radius:50%"></i>Outside range</span></div></div>
      <div class="panel"><h2>Signals <small>Marketing</small></h2>${SIGNALS.filter(s => s.dom === 'Marketing').map(s => `<div class="kv"><span>${s.title}</span>${pill(s.sev)}</div>`).join('')}
        <p class="note" style="margin-top:10px">Both rules read the same two catalogue metrics, <span class="dtag">ctr</span> and <span class="dtag">hook_rate</span>, split by campaign and ad.</p></div></div>

  }

  function kpi(l, v, d, bad, e) {
    return `<div class="panel kpi"><span class="lbl">${l}</span><div class="v">${v}</div><div class="d ${bad ? 'd-neg' : 'd-pos'}">${d}</div><div class="e">${e}</div></div>`;
  }

  function website() {
    const S = [['Gallery', 97, 97], ['Title and price', 91, 92], ['Offers and EMI', 61, 74], ['Size selector', 55, 63], ['Description', 47, 52], ['Reviews', 28, 44], ['FAQ', 17, 21]];
    const rows = S.map((s, i) => {
      const prev = i ? S[i - 1] : null, ret = prev ? Math.round(s[1] / prev[1] * 100) : 100, base = prev ? Math.round(s[2] / prev[2] * 100) : 100;
      const leak = ret < base - 10;
      return `<div class="sec"><span>${s[0]}</span><span class="hb${leak ? ' leak' : ''}" title="${s[1]}% reached, baseline ${s[2]}%"><i style="width:${s[1]}%"></i><em style="left:${s[2]}%"></em></span><span class="ret ${leak ? 'd-neg' : ''}">${s[1]}% · keep ${ret}%${leak ? ' ▼' : ''}</span></div>`;
    }).join('');
    return `<div class="grid cols-3" style="margin-bottom:14px">
      ${kpi('PDP to add-to-cart', '6.1%', '-0.9 pt vs expected', 1, 'Expected 7.0% ± 0.5')}
      ${kpi('Product page views', '18.4k', '+3% vs expected', 0, 'Bots excluded')}
      ${kpi('Median load time (mobile)', '2.9 s', '+0.8 s vs expected', 1, 'Expected 2.1 s ± 0.4')}</div>
    <div class="grid split">
      <div class="panel"><h2>Section reach · Cotton Kurta Set <small>mobile, 28 days</small></h2>${rows}
        <div class="legend"><span><i style="background:var(--s1)"></i>Reached today</span><span><i style="background:var(--ink);width:2px;height:12px"></i>28-day baseline</span><span><i style="background:var(--crit)"></i>Leak: retention well below baseline</span></div>
        <p class="note" style="margin-top:8px">"Keep" is the share of the previous section's viewers who also reach this one. A leak is a drop in that ratio, so a naturally small section like FAQ is not flagged.</p></div>
      <div class="panel"><h2>Signals <small>Website</small></h2>${SIGNALS.filter(s => s.dom === 'Website').map(s => `<div class="kv"><span>${s.title}<div class="note">${s.ent}</div></span>${pill(s.sev)}</div>`).join('')}
        <p class="note" style="margin-top:10px">One stage-leak rule covers every product and section. New sections appear when the tracker registers them.</p></div></div>`;
  }

  function inventory() {
    const R = [['Linen Shirt Olive / M', 130, 31, 12], ['Cotton Kurta Set Mustard / L', 260, 24, 10], ['Chino Beige / 32', 95, 14, 14], ['Printed Dress Teal / S', 410, 22, 10], ['Denim Jacket Indigo / L', 420, 3, 14]].map(r => {
      const cover = r[1] / r[2], st = cover < r[3] ? 'crit' : cover < r[3] * 1.5 ? 'warn' : cover > 60 ? 'info' : 'ok';
      const max = 150, bar = Math.min(cover, max) / max * 100;
      const col = st === 'crit' ? 'var(--crit)' : st === 'warn' ? 'var(--warn)' : st === 'info' ? 'var(--ink-3)' : 'var(--ok)';
      return `<tr><td><b>${r[0]}</b></td><td class="r num">${r[1]}</td><td class="r num">${r[2]}/d</td><td class="r num"><b>${cover.toFixed(1)} d</b></td><td><div class="cover" title="Lead time ${r[3]} days"><i style="width:${bar}%;background:${col}"></i><em style="left:${r[3] / max * 100}%"></em></div></td><td class="r num">${r[3]} d</td><td>${st === 'ok' ? '<span class="pill ok">Healthy</span>' : st === 'info' ? '<span class="pill info">Overstock</span>' : pill(st)}</td></tr>`;
    }).join('');
    return `<div class="grid cols-3" style="margin-bottom:14px">
      ${kpi('SKUs under lead-time cover', '7 / 212', '+3 since last week', 1, 'Rule: on hand ÷ 7-day velocity < supplier lead time')}
      ${kpi('Estimated sales at risk', '₹3.1L', 'if nothing is reordered', 1, 'Uses current velocity x lead-time gap')}
      ${kpi('Overstock value tied up', '₹6.4L', 'SKUs over 60 days cover', 0, 'Not urgent; shown for planning')}</div>
    <div class="panel"><h2>Cover against lead time <small>lowest cover first</small></h2><div class="tw"><table>
      <thead><tr><th>SKU</th><th class="r">On hand</th><th class="r">Velocity</th><th class="r">Cover</th><th>Cover vs lead time (tick)</th><th class="r">Lead time</th><th>State</th></tr></thead><tbody>${R}</tbody></table></div>
      <p class="note" style="margin-top:10px">Cover is a derived metric, <span class="dtag">stock_on_hand / units_sold_7d_avg</span>. The monitor needs no new code once that metric exists in the catalogue.</p></div>`;
  }

  function finance() {
    const L = [['Net sales', '₹41.2L', '-4% vs expected', 1], ['Contribution margin', '31.4%', '-1.6 pt vs expected', 1], ['MER', '2.1x', '-0.8x vs expected', 1], ['RTO cost', '₹2.9L', '+18% vs expected', 1]];
    const C = [['Cost of goods', '₹18.1L', '+2%', 0], ['Shipping', '₹3.4L', '+1%', 0], ['Payment fees', '₹0.9L', '0%', 0], ['RTO cost', '₹2.9L', '+18%', 1], ['Ad spend', '₹14.7L', '+12%', 1]].map(r => `<tr><td>${r[0]}</td><td class="r num">${r[1]}</td><td class="r num ${r[3] ? 'd-neg' : ''}">${r[2]}</td></tr>`).join('');
    return `<div class="grid cols-4" style="margin-bottom:14px">${L.map(l => kpi(l[0], l[1], l[2], l[3], 'Event-date basis')).join('')}</div>
    <div class="grid split">
      <div class="panel"><h2>Net profit <small>last 28 days</small></h2><div class="kpi"><div class="v d-neg">−₹1.8L</div><div class="d">Gap to expected band: <b class="num">−₹2.6L</b></div></div>
        <p class="note" style="margin-top:12px">Percent change is hidden here because the base is negative: a move from −₹0.3L to −₹1.8L reads as "−446%", which is meaningless. Metrics that can go negative are compared as an absolute gap to their band. Each metric declares its shape once in the catalogue.</p></div>
      <div class="panel"><h2>Cost lines <small>vs expected</small></h2><div class="tw"><table><thead><tr><th>Line</th><th class="r">28d</th><th class="r">Δ</th></tr></thead><tbody>${C}</tbody></table></div></div></div>`;
  }

  const MON = [
    ['hook_rate_decline', 'hook_rate', 'ad', 'trend', '7d', 'Marketing', 1, 1],
    ['ctr_vs_baseline', 'ctr', 'campaign', 'baseline', '1d', 'Marketing', 1, 1],
    ['pdp_section_leak', 'section_reach_rate', 'product, section', 'stage_leak', '1d', 'Website', 1, 2],
    ['stock_cover_below_lead', 'stock_cover_days', 'sku', 'threshold', 'live', 'Inventory', 1, 2],
    ['mer_vs_baseline', 'mer', '–', 'baseline', '1d', 'Finance', 1, 1],
    ['source_row_count', 'rows_ingested', 'source', 'freshness', 'hourly', 'Data', 1, 1],
    ['return_rate_by_pincode', 'return_rate', 'pincode', 'baseline', '7d', 'Finance', 0, 0]
  ];
  const YAML = m => `- id: ${m[0]}
  metric: ${m[1]}${m[2] !== '–' ? `\n  by: [${m[2]}]` : ''}
  detector: ${m[3]}
  window: ${m[4]}
  min_volume: { metric: ${m[5] === 'Marketing' ? 'impressions' : m[5] === 'Website' ? 'section_exposed' : m[5] === 'Inventory' ? 'units_sold' : 'orders'}, gte: ${m[5] === 'Marketing' ? 5000 : 200} }
  owner: ${m[5].toLowerCase()}
  severity_weight: ${m[5] === 'Marketing' ? 'ad_spend' : m[5] === 'Inventory' ? 'sales_at_risk' : 'net_sales'}
  notify: { critical: ${m[5].toLowerCase()}-oncall, watch: digest }`;

  function monitors() {
    const rows = MON.map((m, i) => `<tr data-m="${i}" class="${i === 0 ? 'sel' : ''}"><td><b class="dtag">${m[0]}</b></td><td class="dtag">${m[1]}</td><td>${m[2]}</td><td><span class="tag">${m[3]}</span></td><td class="r num">${m[4]}</td><td>${m[5]}</td><td class="r num">${m[7]}</td><td><button class="tgl" type="button" role="switch" aria-checked="${!!m[6]}" aria-label="Enable ${m[0]}"></button></td></tr>`).join('');
    return `<div class="grid split"><div class="panel"><h2>Monitors <small>7 of 41 shown</small></h2><div class="tw"><table>
      <thead><tr><th>Monitor</th><th>Metric</th><th>Split by</th><th>Detector</th><th class="r">Window</th><th>Owner</th><th class="r">Open</th><th>On</th></tr></thead><tbody id="mrows">${rows}</tbody></table></div></div>
      <div class="panel"><h2>Config <small id="mname">${MON[0][0]}</small></h2><pre class="yaml" id="yaml">${YAML(MON[0])}</pre>
        <p class="note" style="margin-top:12px">Five detector kinds cover every case so far: <b>baseline</b>, <b>trend</b>, <b>threshold</b>, <b>stage_leak</b>, <b>freshness</b>. A new case is a row like this one. A new detector kind is one function.</p>
        <p class="note" style="margin-top:8px"><b>min_volume</b> mutes a monitor when the denominator is too small to trust, which keeps small ads and rarely viewed sections from paging anyone.</p></div></div>`;
  }

  /* ---------- shell ---------- */
  const open = d => SIGNALS.filter(s => s.dom === d && !s.acked).length;
  function renderNav(cur) {
    const owners = { marketing: 'Marketing', website: 'Website', inventory: 'Inventory', finance: 'Finance' };
    const total = SIGNALS.filter(s => !s.acked).length;
    $('#nav').innerHTML = DOMAINS.map(d => {
      const c = d.id === 'unified' ? total : owners[d.id] ? open(owners[d.id]) : '';
      const crit = owners[d.id] ? SIGNALS.some(s => s.dom === owners[d.id] && s.sev === 'crit' && !s.acked) : false;
      return (d.id === 'marketing' ? '<div class="grp">Domains</div>' : d.id === 'monitors' ? '<div class="grp">Setup</div>' : '') +
        `<button type="button" data-go="${d.id}"${d.id === cur ? ' aria-current="page"' : ''}>${d.label}${c !== '' ? `<span class="badge${crit ? ' crit' : ''}">${c}</span>` : ''}</button>`;
    }).join('');
  }
  function show(id) {
    const d = DOMAINS.find(x => x.id === id) || DOMAINS[0];
    renderNav(d.id);
    $('#title').textContent = d.id === 'unified' ? 'Unified view' : d.label;
    $('#subtitle').textContent = d.sub;
    const v = $('#view');
    v.innerHTML = { unified, marketing, website, inventory, finance, monitors }[d.id]();
    if (d.id === 'unified') updateCount();
    if (d.id === 'marketing') lineChart($('#ctr'), { ...ctr, half: .22, unit: '%', flagFrom: 24, label: 'CTR against expected range for 28 days' });
    if (d.id !== 'unified' && ['marketing', 'website', 'inventory', 'finance'].includes(d.id)) {
      const f = document.createElement('div'); f.style.marginTop = '14px';
      f.innerHTML = `<div class="feedhead"><h2>Open signals in ${d.label}</h2></div><div id="feed">${feedHTML(d.owner)}</div>`;
      v.appendChild(f);
    }
  }
  function updateCount() { const el = $('#cnt'); if (el) el.textContent = ` ${$$('.sig:not(.acked)').length} need attention`; }
  const $$ = s => Array.from(document.querySelectorAll(s));

  document.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go) { location.hash = go.dataset.go; return; }
    const chip = e.target.closest('#chips .chip');
    if (chip) {
      $$('#chips .chip').forEach(c => c.setAttribute('aria-pressed', c === chip));
      $('#feed').innerHTML = feedHTML(chip.textContent === 'All' ? null : chip.textContent); return;
    }
    const b = e.target.closest('[data-act]');
    if (b) {
      const card = b.closest('.sig'), s = SIGNALS.find(x => x.id == card.dataset.id);
      if (b.dataset.act === 'ack') { s.acked = !s.acked; card.classList.toggle('acked', s.acked); b.textContent = s.acked ? 'Acknowledged' : 'Acknowledge'; renderNav(location.hash.slice(1) || 'unified'); updateCount(); }
      else { const w = $('.why', card); w.hidden = !w.hidden; b.setAttribute('aria-expanded', !w.hidden); b.textContent = w.hidden ? 'Ask why' : 'Hide'; }
      return;
    }
    const row = e.target.closest('tr[data-m]');
    if (row) { $$('tr[data-m]').forEach(r => r.classList.toggle('sel', r === row)); const m = MON[row.dataset.m]; $('#yaml').textContent = YAML(m); $('#mname').textContent = m[0]; }
    const t = e.target.closest('.tgl'); if (t) t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true');
  });
  $('#win').addEventListener('click', e => { const b = e.target.closest('button'); if (b) $$('#win button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#themebtn').addEventListener('click', () => {
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
  });
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if ($('#ctr')) show(location.hash.slice(1)); }, 150); });
  show(location.hash.slice(1));
})();
</script>
