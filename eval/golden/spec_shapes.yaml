# Golden cases for the Phase 1 spec/plan shapes (M1.2-M1.3). Ported from
# tests/fixtures/query_specs/th383_and_regressions.jsonl so the eval suite
# exercises the shapes the spec compiler must produce, not only lookups.
#
# `expect.spec` is a partial QuestionSpec compared field-by-field against the
# spec the run surfaces (see seleric_swarm/evals/_scorer.py::spec_matches).
# Lists (measures, entities, windows) are matched element-wise and in order, so
# this file pins the expected order. Omitted fields are not scored.
#
# Truth is catalogue ids / dates only, never SQL, so a case follows the
# catalogue. `as_of` is the case clock, not the wall clock.
cases:
  - id: spec-th383-entity-comparison
    as_of: "2026-09-30"
    turns:
      - "Over the last 3 days, why did TH-383-SUSPENDER-26SEP-ADV+ and TH-383-SUSPENDER-29SEP perform differently yesterday?"
    tags: [entity_comparison, comparison, why]
    expect:
      spec:
        kind: analysis
        shape: entity_comparison
        entities:
          - dimension: campaign_name
            values: ["TH-383-SUSPENDER-26SEP-ADV+", "TH-383-SUSPENDER-29SEP"]
        windows:
          - {role: event, start: "2026-09-29", end: "2026-09-29", token: yesterday}
          - {role: baseline, start: "2026-09-27", end: "2026-09-28", token: prior_2d}
          - {role: context, start: "2026-09-27", end: "2026-09-29", token: last_3d}

  - id: spec-last3-vs-today
    as_of: "2026-10-06"
    turns: ["the last 3 days versus today"]
    tags: [period_comparison, comparison]
    expect:
      spec:
        kind: analysis
        shape: period_comparison

  - id: spec-net-sales-yesterday
    as_of: "2026-10-10"
    turns: ["What was net sales yesterday?"]
    tags: [lookup]
    expect:
      status: completed
      spec:
        kind: analysis
        shape: lookup
        measures:
          - metric_id: net_sales
        windows:
          - {role: event, start: "2026-10-09", end: "2026-10-09", token: yesterday}

  - id: spec-last-week-roas
    as_of: "2026-10-10"
    turns: ["What was ROAS last week?"]
    tags: [lookup, roas]
    expect:
      status: completed
      spec:
        kind: analysis
        shape: lookup
        windows:
          - {role: event, start: "2026-09-28", end: "2026-10-04", token: last_week}

  - id: spec-why-cac-yesterday
    as_of: "2026-10-09"
    turns: ["Why did CAC increase yesterday?"]
    tags: [why]
    expect:
      spec:
        kind: analysis
        shape: why_single_metric
        windows:
          - {role: event, start: "2026-10-08", end: "2026-10-08", token: yesterday}
          - {role: baseline, start: "2026-10-07", end: "2026-10-07", token: prior_1d}

  - id: spec-ads-by-platform
    as_of: "2026-10-10"
    turns: ["Ad spend by platform last 7 days"]
    tags: [breakdown]
    expect:
      spec:
        kind: analysis
        shape: breakdown
        breakdowns: [platform]
        windows:
          - {role: event, start: "2026-10-03", end: "2026-10-09", token: last_7d}

  - id: spec-followup-keeps-windows
    as_of: "2026-10-09"
    turns:
      - "Why did CAC increase yesterday?"
      - "why?"
    tags: [follow_up, why]
    expect:
      spec:
        shape: why_single_metric
        windows:
          - {role: event, start: "2026-10-08", end: "2026-10-08"}
          - {role: baseline, start: "2026-10-07", end: "2026-10-07"}
