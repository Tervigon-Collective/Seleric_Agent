# Step 1 of 2 — HTTP only, so certbot can issue the cert. Adds a NEW vhost; touches no existing one.
#   sudo cp deploy/nginx/agent.seleric.com-http.conf /etc/nginx/sites-available/agent.seleric.com
#   sudo ln -s /etc/nginx/sites-available/agent.seleric.com /etc/nginx/sites-enabled/agent.seleric.com
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d agent.seleric.com
# Then step 2: agent.seleric.com-https.conf

server {
    listen 80;
    listen [::]:80;
    server_name agent.seleric.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
