# Step 2 of 2 — HTTPS for the Seleric Agent UI/API. Browsers only allow the microphone
# (voice) on HTTPS, so voice must be used via https://agent.seleric.com/ui/.
# Proxies to the existing API container on 127.0.0.1:8090 (which stays reachable as before).
#   sudo cp deploy/nginx/agent.seleric.com-https.conf /etc/nginx/sites-available/agent.seleric.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name agent.seleric.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.seleric.com;

    ssl_certificate     /etc/letsencrypt/live/agent.seleric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.seleric.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;   # chat attachments

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # Thread/run events are streamed (SSE): no buffering, long reads.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
