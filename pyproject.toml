[project]
name = "seleric-swarm"
version = "0.1.0"
description = "Dynamic multi-agent business intelligence swarm scaffold"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk>=0.3",
  "dowhy>=0.14",
  "fastapi>=0.115",
  "httpx>=0.28",
  "langgraph>=1.2",
  "langsmith>=0.3",
  "mcp[cli]>=2.0",
  "numpy>=2.0",
  "openai>=1.60",
  "orjson>=3.10",
  "pandas>=2.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "redis>=5.2",
  "scikit-learn>=1.6",
  "sqlalchemy>=2.0",
  "statsmodels>=0.14",
  "structlog>=25.0",
  "tenacity>=9.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "mypy>=1.14",
]

[project.scripts]
seleric-eval = "seleric_swarm.eval.cli:main"
seleric-api = "seleric_swarm.main:serve"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"src/seleric_swarm/orchestration/runner.py" = ["S110"]
"src/seleric_swarm/eval/evaluators.py" = ["SIM103"]
"src/seleric_swarm/llm/adapters/fake.py" = ["TRY203", "DTZ005"]
"src/seleric_swarm/services/time_range.py" = ["DTZ005"]


[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
